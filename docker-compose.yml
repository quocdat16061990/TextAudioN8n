version: "3.9"

services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8501}:8501"
    environment:
      PORT: 8501
    env_file:
      - .env
    volumes:
      - "./temp_audio:/app/temp_audio"
      - "./temp_component:/app/temp_component"
    restart: unless-stopped

